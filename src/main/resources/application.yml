spring:
  application:
    name: margin-service
  config:
    # Local secrets (e.g. FINNHUB_API_KEY) when running from Maven/IDE; see local.env
    import: optional:file:./local.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          # Revalidate the UI's JS/CSS on every load so a redeploy never pairs new HTML with stale assets
          no-cache: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      # Propagates the trace context (W3C traceparent header) onto every margin-call record
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Plain JSON payloads so non-Java consumers aren't coupled to Java class names
        spring.json.add.type.headers: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0         # trace every request; lower this under real production load

logging:
  pattern:
    # Plain-text logs: prefix each line with trace, span and correlation IDs
    correlation: "[%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "

springdoc:
  # Document only the responses declared on each operation, not every @ExceptionHandler on every endpoint
  override-with-generic-response: false
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

market-data:
  finnhub:
    base-url: https://finnhub.io/api/v1
    # Free key from https://finnhub.io; without one, price lookups return 503 and prices are entered manually
    api-key: ${FINNHUB_API_KEY:}
    timeout: 3s

# --- Margin model parameters (illustrative values, not a regulatory model) ---
margin:
  margin-call-topic: margin-calls
  publish-timeout: 5s
  maintenance-ratio: 0.75
  initial-margin-rates:
    EQUITY: 0.15
    BOND: 0.05
    FX: 0.04
    COMMODITY: 0.10
  haircuts:
    CASH: 0.00
    GOVERNMENT_BOND: 0.02
    CORPORATE_BOND: 0.10
    EQUITY: 0.25

---
# Structured JSON logs (Elastic Common Schema) for log aggregators; enabled in docker-compose.
# Each line carries traceId, spanId, correlationId and audit key-value pairs as JSON fields.
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
