name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

# A newer push to the same branch or PR supersedes an in-progress run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Checkstyle (validate) -> unit tests incl. ArchUnit rules (surefire, *Test)
      # -> integration tests with embedded Kafka (failsafe, *IT) -> JaCoCo coverage gate (verify)
      - name: Build, test and check quality gates
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7 }
              END { printf "### Coverage\n\n| Lines | Branches |\n|---|---|\n| %.1f%% | %.1f%% |\n",
                    100*lc/(lm+lc), 100*bc/(bm+bc) }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Docker image
        run: docker build -t margin-service:${{ github.sha }} .
